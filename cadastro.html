<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space&Room - Cadastro</title>
    <link rel="stylesheet" href="pg.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <div class="card__sidebar">
                <h1 class="sidebar__title">Crie sua conta!</h1>
                <span class="sidebar__divider" aria-hidden="true"></span>
                <p class="sidebar__brand">Space&Room</p>
            </div>

            <form class="card__form">
                <h2 class="form__title">Cadastre-se</h2>
                
                <div class="form__group">
                    <label for="name" class="form__label">Nome completo</label>
                    <input type="text" id="name" class="form__input" placeholder="Digite seu nome completo" required>
                </div>

                <div class="form__group">
                    <label for="email" class="form__label">Email</label>
                    <input type="email" id="email" class="form__input" placeholder="Digite seu e-mail" required>
                </div>

                <div class="form__group">
                    <label for="password" class="form__label">Senha</label>
                    <input type="password" id="password" class="form__input" placeholder="Digite sua senha" required>
                </div>

                <div class="form__actions">
                    <button type="submit" class="btn btn--primary">Cadastrar</button>
                    <button type="button" class="btn btn--outline">
                        <img src="" alt="" width="20">
                       
                    </button>
                </div>

                <footer class="form__footer">
                    <a href="login.html" class="form__link">Já tem conta? Faça Login</a>
                </footer>
            </form>
        </section>
    </main>
</body>
</html>
