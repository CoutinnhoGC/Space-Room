<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space&Room - Login</title>
    <link rel="stylesheet" href="pg.css">
</head>
<body>
    <main class="login-container">
        <div class="glass-card">
            <section class="brand-side">
                <div class="brand-content">
                    <h1 class="welcome-text">Bem vindo!</h1>
                    <div class="cyan-divider"></div>
                    <div class="logo-wrapper">
                        <img src="" alt="Space&Room Logo" class="main-logo">
                        <div class="logo-text-group">
                            <span class="logo-name">Space<span class="logo-and">&</span>Room</span>
                            <span class="logo-tagline">Onde a reserva se torna inteligente</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-side">
                <h2 class="form-title">Login</h2>
                <form>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Digite seu e-mail">
                    </div>
                    <div class="input-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="Digite sua senha">
                    </div>
                    <button type="submit" class="btn-main">Entrar</button>
                    
                    <div class="form-footer">
                        <a href="#" class="link-light">Esqueceu sua senha? <span class="blue-text">Recuperar</span></a>
                        <a href="cadastro.html" class="link-light">Não tem conta? <span class="blue-text">Cadastre-se</span></a>
                    </div>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
